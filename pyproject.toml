[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "blindspot"
version = "0.1.0"
description = "A simulated robot arm that follows natural-language pick-and-place instructions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "gymnasium>=1.2,<2",
    "imageio[ffmpeg]>=2.38,<3",
    "matplotlib>=3.9,<4",
    "mink==1.3.0",
    "mujoco>=3.3,<4",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "scipy>=1.15,<2",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
imitation = [
    "lerobot[dataset]==0.6.1",
    "torch>=2.10,<2.12",
    "torchvision>=0.25,<0.27",
]
rl = [
    "stable-baselines3>=2.9,<3",
    "torch>=2.10,<2.12",
]
training = [
    "tensorboard>=2.19,<3",
    "torch>=2.10,<2.12",
]
vla = [
    "huggingface-hub>=1.0,<2",
    "lerobot[dataset]==0.6.1",
    "num2words>=0.5.14,<1",
    "tensorboard>=2.19,<3",
    "torch>=2.10,<2.12",
    "torchvision>=0.25,<0.27",
    "transformers==5.20.2",
]

jepa = [
    "huggingface-hub>=1.0,<2",
    "lerobot[dataset]==0.6.1",
    "tensorboard>=2.19,<3",
    "torch>=2.10,<2.12",
    "transformers==5.20.2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint.per-file-ignores]
# The evaluator intentionally serializes ordinary exceptions into episode records.
"eval/runner.py" = ["BLE001"]
"eval/vla_profile.py" = ["BLE001"]

[tool.hatch.build.targets.wheel]
packages = ["common", "envs", "motion", "skills", "data", "policies", "encoders", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["rendering: requires an available MuJoCo rendering backend"]
